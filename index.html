body {
    font-family: Verdana;

}
h1 {
    text-align: center;
    color: #8B1E2D;
    margin-top: 50px;
}
h2 {
    text-align: center;
    color: #8B1E2D;

}
.menu {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    background-color: #457B9D;
    padding: 20px;
    border-radius: 12px;
}
.menu a {
    display: block;
    background-color: #F4D35E;
    color: #8B1E2D;
    padding: 12px 20px;
    text-decoration-style: dotted;
    border-radius: 6px;
    border: dotted;
    transition: background-color 0.3s ease, color 0.3s ease;
}
.menu-item {
position: relative;
}
.menu a:hover {
    background-color: #8B1E2D;
    color: #F4D35E;
    transform: translateY(-3px);
    box-shadow: 0 0 10px #457B9D 0 0 25px #8B1E2D;
}

.submenu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 150px;
    background-color: #800020;
    padding: 8px;
    border-radius: 8px;
    z-index: 10;
}
.menu-item:hover .submenu {
    display: block;
}
.submenu a {
    background-color: #F4D35E;
    margin: 5px 0;
    border-radius: 5px;
}
.submenu a:hover {
    background-color: #F3E6D5;
    transform: translateX(5px);
}
img {
    width: 250px;
    height: 250px;
    align-items: center;
    justify-content: center;
    margin: auto;
    display: block;
}
